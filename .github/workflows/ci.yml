name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # Timing budgets need an isolated CPU; concurrent QA files skew p95/max.
      - run: node --test --test-concurrency=1 test/qa/*.test.mjs
      - run: npm run test:http
