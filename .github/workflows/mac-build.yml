name: Build macOS app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:all && npm run test:http
      - run: npm run build:app
      - name: Verify relocated bundle
        run: |
          ditto -x -k output/SmartTeleprompter-1.3.0-macOS-arm64.zip "$RUNNER_TEMP/teleprompter"
          node tools/verify-bundle.mjs "$RUNNER_TEMP/teleprompter/智能提词器.app"
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTeleprompter-macOS-arm64
          path: output/SmartTeleprompter-1.3.0-macOS-arm64.zip
          if-no-files-found: error
